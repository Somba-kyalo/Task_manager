{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Manager - Home</title>
    
    <link rel="stylesheet" href="{% static 'taskapp/css/taskapp.css' %}">
</head>
<body>
    <h2>Task Manager Dashboard</h2>
    
    <!-- create a new task -->
    <form method="POST" class="task-form">
        {% csrf_token %}
        <input type="text" name="title" placeholder="Add a new task..." required>
        <button type="submit">Add Task</button>
    </form>

    <!-- list to read all available tasks -->
    <ul>
        {% for task in tasks %}
            <li>
                <span class="{% if task.completed %}completed{% endif %}">{{ task.title }}</span>
                <div class="actions">
                    <a href="{% url 'task_update' task.id %}">Edit</a>
                    <a class="delete" href="{% url 'task_delete' task.id %}">Delete</a>
                </div>
            </li>
        {% empty %}
            <li>No tasks found. Add a new one above!</li>
        {% endfor %}
    </ul>

    
    <script src="{% static 'taskapp/js/taskapp.js' %}"></script>
</body>
</html>
