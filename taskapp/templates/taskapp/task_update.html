{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Task</title>
    <link rel="stylesheet" href="{% static 'taskapp/css/taskapp.css' %}">
</head>
<body>
    <h2>Edit Task Details</h2>
    
    <!-- update an existing task -->
    <form method="POST">
        {% csrf_token %}
        <p>
            <label>Title:</label><br>
            <input type="text" name="title" value="{{ task.title }}" required style="width: 100%; padding: 8px; margin-top: 5px;">
        </p>
        <p>
            <label>Description:</label><br>
            <textarea name="description" placeholder="Optional notes..." style="width: 100%; padding: 8px; height: 100px; margin-top: 5px;">{{ task.description|default:"" }}</textarea>
        </p>
        <p>
            <label>
                <input type="checkbox" name="completed" {% if task.completed %}checked{% endif %}> Mark as Completed
            </label>
        </p>
        <p>
            <button type="submit" style="padding: 8px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">Save Changes</button> 
            <a href="{% url 'task_list' %}" style="margin-left: 10px; text-decoration: none; color: #555;">Cancel</a>
        </p>
    </form>
</body>
</html>
